# InstaBox 免费机保活 + 自动恢复 + 自动提交（真正自动化）
# 部署说明见同目录 instabox-keepalive-部署说明.md
name: instabox-keepalive

on:
  schedule:
    - cron: '*/20 * * * *'   # 每 20 分钟；更稳可改 '*/15 * * * *'
  workflow_dispatch: {}       # 手动触发测试

permissions:
  contents: write              # 允许自动提交 push

jobs:
  keepalive:
    runs-on: ubuntu-latest
    env:
      BASE: https://api.instabox.sh/v1/machines
      INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
      MACHINE_ID: ${{ vars.INSTABOX_MACHINE_ID }}
    steps:
      # 1) 检出仓库（自动提交需要；fetch-depth:1 看最近一次提交日期即可）
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 2) 保活 / 自动恢复机器（机器名或 m_ id 均可，统一解析为规范 id 后调用）
      - name: Keep alive / auto-recover
        run: |
          set -euo pipefail
          AUTH="X-API-Key: ${INSTABOX_API_KEY}"
          BASE="https://api.instabox.sh/v1/machines"

          # 查询机器（名字或 m_ id 均可），解析规范 id 与状态
          json=$(curl -sS -f -H "$AUTH" "$BASE/${MACHINE_ID}") \
            || { echo "获取机器信息失败：请检查 INSTABOX_MACHINE_ID 与 API key 权限（需 machines:read + machines:write）"; exit 1; }
          STATE=$(echo "$json" | jq -r '.state')
          MID=$(echo "$json" | jq -r '.id')
          echo "当前状态: ${STATE} (机器 id: ${MID})"

          # 统一封装：打印 HTTP 状态码与响应体，失败即返回非 0
          call_api() { # method path
            local resp code body
            resp=$(curl -sS -w $'\n%{http_code}' -X "$1" "$BASE/$MID/$2" \
                  -H "$AUTH" -H "Content-Type: application/json" \
                  -H "Idempotency-Key: $(date +%s%N)" || true)
            code=$(echo "$resp" | tail -1)
            body=$(echo "$resp" | sed '$d')
            echo "HTTP ${code}: ${body}"
            case "$code" in 200|201|202) return 0 ;; *) return 1 ;; esac
          }

          case "$STATE" in
            running)
              # 平台可见命令 -> 重置 30 分钟空闲计时（免费版唯一合法保活通道）
              resp=$(curl -sS -w $'\n%{http_code}' -X POST "$BASE/$MID/exec" \
                    -H "$AUTH" -H "Content-Type: application/json" \
                    -d '{"cmd":"echo keepalive $(date -u +%FT%TZ)"}' || true)
              echo "保活命令 HTTP $(echo "$resp" | tail -1): $(echo "$resp" | sed '$d')"
              ;;
            suspended)
              # 休眠：用 resume 恢复（保留内存与进程）
              call_api POST resume || { echo "resume 失败"; exit 1; }
              ;;
            stopped|error)
              # 停止/出错：用 start 冷启动
              call_api POST start || { echo "start 失败"; exit 1; }
              ;;
            *)
              echo "状态 $STATE 正在变化中，本次跳过"
              ;;
          esac

      # 3) 自动提交：距上次提交 >7 天就空提交并 push，
      #    避免 GitHub 对公开仓库"60 天无 commit 自动停用定时任务"。
      #    if: always() 保证即使保活步骤临时失败，续命提交也会执行。
      - name: Auto-commit to keep schedule enabled
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LAST=$(git log -1 --format=%cs)
          CUTOFF=$(date -d "7 days ago" +%s)
          if [ "$(date -d "$LAST" +%s)" -lt "$CUTOFF" ]; then
            git commit --allow-empty -m "chore: keep scheduled workflow active"
            git push
            echo "已自动空提交（上次 $LAST），定时任务保持启用"
          else
            echo "距上次提交不足 7 天（$LAST），跳过"
          fi
